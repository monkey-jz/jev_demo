<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>睡眠手环 · 智能排障台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b16;
    --panel: rgba(17, 25, 46, 0.88);
    --panel-2: rgba(11, 18, 34, 0.92);
    --line: rgba(148, 163, 184, 0.16);
    --line-strong: rgba(148, 163, 184, 0.28);
    --text: #edf2ff;
    --muted: #92a0bd;
    --soft: #667590;
    --indigo: #8b9cff;
    --violet: #b49cff;
    --cyan: #5eead4;
    --amber: #fbbf24;
    --green: #34d399;
    --red: #fb7185;
    --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    --radius: 18px;
    font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    color: var(--text);
    background:
      radial-gradient(900px 520px at 8% -5%, rgba(139, 156, 255, 0.17), transparent 62%),
      radial-gradient(700px 460px at 96% 8%, rgba(94, 234, 212, 0.09), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(180, 156, 255, 0.08), transparent 65%),
      var(--bg);
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.28;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.6) 0 1px, transparent 1.5px),
      radial-gradient(circle at 86% 60%, rgba(255, 255, 255, 0.55) 0 1px, transparent 1.5px),
      radial-gradient(circle at 34% 78%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.5px),
      radial-gradient(circle at 56% 44%, rgba(255, 255, 255, 0.4) 0 1px, transparent 1.5px);
    background-size: 520px 480px, 680px 560px, 460px 520px, 620px 460px, 760px 600px;
  }

  button, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }

  .shell {
    position: relative;
    width: min(1320px, calc(100% - 40px));
    margin: 0 auto;
    padding: 22px 0 30px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
  }

  .logo {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: 14px;
    font-size: 24px;
    color: #0a1020;
    background: linear-gradient(135deg, #d9e3ff, #8b9cff 52%, #5eead4);
    box-shadow: 0 10px 30px rgba(139, 156, 255, 0.28);
  }

  .brand h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.2px;
    font-weight: 650;
  }

  .brand p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.2px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(94, 234, 212, 0.22);
    background: rgba(94, 234, 212, 0.08);
    color: #b9fff2;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.11);
    animation: breathe 2.2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }

  .ghost {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.035);
    color: var(--muted);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    transition: 0.18s ease;
  }

  .ghost:hover:not(:disabled) {
    color: var(--text);
    border-color: var(--line-strong);
    background: rgba(255, 255, 255, 0.06);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.48fr) minmax(330px, 0.82fr);
    gap: 16px;
    align-items: stretch;
  }

  .chat-panel,
  .card {
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .chat-panel {
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    min-height: 660px;
    height: calc(100vh - 132px);
    max-height: 900px;
    overflow: hidden;
  }

  .case-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent);
  }

  .case-id {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    font-size: 12px;
    color: var(--muted);
  }

  .case-id strong {
    color: #cbd6ee;
    font-weight: 550;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .case-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(251, 191, 36, 0.22);
    background: rgba(251, 191, 36, 0.075);
    color: #ffe5a3;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 11px;
    white-space: nowrap;
  }

  .case-chip::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
  }

  .case-chip.resolved {
    color: #b9fff2;
    border-color: rgba(94, 234, 212, 0.24);
    background: rgba(94, 234, 212, 0.08);
  }

  .case-chip.resolved::before { background: var(--cyan); }

  .security-note {
    color: var(--soft);
    font-size: 11px;
    white-space: nowrap;
  }

  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 20px 20px 8px;
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar,
  .side::-webkit-scrollbar,
  .api-log::-webkit-scrollbar,
  .quick-replies::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .chat::-webkit-scrollbar-thumb,
  .side::-webkit-scrollbar-thumb,
  .api-log::-webkit-scrollbar-thumb,
  .quick-replies::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.18);
    border-radius: 999px;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 15px;
    animation: enter 0.22s ease-out both;
  }

  .msg.user { flex-direction: row-reverse; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 600;
    color: #cbd6ee;
    background: #17213a;
    border: 1px solid var(--line);
    margin-top: 1px;
  }

  .avatar.assistant {
    color: #dce6ff;
    background: linear-gradient(145deg, rgba(139, 156, 255, 0.28), rgba(94, 234, 212, 0.1));
    border-color: rgba(139, 156, 255, 0.28);
    font-size: 18px;
  }

  .avatar.user {
    color: #0a1020;
    background: linear-gradient(135deg, #d9e3ff, #9dafff);
    border-color: transparent;
  }

  .msg-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: min(78%, 650px);
    min-width: 0;
  }

  .msg.user .msg-body { align-items: flex-end; }

  .stage-tag {
    width: fit-content;
    color: #9fb0d3;
    font-size: 11px;
    letter-spacing: 0.35px;
    text-transform: uppercase;
    padding-left: 2px;
  }

  .bubble {
    padding: 12px 14px;
    border-radius: 4px 16px 16px 16px;
    border: 1px solid var(--line);
    background: rgba(23, 34, 58, 0.92);
    color: #e6ecfb;
    line-height: 1.68;
    font-size: 13.6px;
    overflow-wrap: anywhere;
  }

  .msg.user .bubble {
    border-radius: 16px 4px 16px 16px;
    border-color: rgba(139, 156, 255, 0.24);
    background: linear-gradient(135deg, rgba(122, 141, 255, 0.9), rgba(151, 126, 255, 0.82));
    color: #fff;
    box-shadow: 0 8px 28px rgba(122, 141, 255, 0.14);
  }

  .bubble-text { white-space: pre-wrap; }

  .signal-line {
    color: var(--soft);
    font-size: 11.5px;
    line-height: 1.5;
    padding-left: 3px;
  }

  .signal-line strong { color: #aab9d7; font-weight: 550; }

  .typing {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 18px;
    padding: 1px 0;
  }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #9bacd0;
    animation: typing 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.14s; }
  .typing span:nth-child(3) { animation-delay: 0.28s; }

  @keyframes typing {
    0%, 70%, 100% { opacity: 0.30; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-3px); }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 20px 10px;
    max-height: 126px;
    overflow-y: auto;
  }

  .quick-replies:empty { padding-bottom: 0; }

  .quick-btn {
    border: 1px solid rgba(139, 156, 255, 0.24);
    background: rgba(139, 156, 255, 0.075);
    color: #c8d4f3;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.25;
    transition: 0.16s ease;
    text-align: left;
  }

  .quick-btn:hover:not(:disabled) {
    color: #fff;
    background: rgba(139, 156, 255, 0.16);
    border-color: rgba(139, 156, 255, 0.44);
    transform: translateY(-1px);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    padding: 10px 14px 6px;
    border-top: 1px solid var(--line);
    background: rgba(8, 13, 25, 0.52);
  }

  .composer textarea {
    flex: 1;
    min-height: 42px;
    max-height: 112px;
    resize: none;
    border: 1px solid var(--line);
    background: rgba(8, 13, 25, 0.82);
    color: var(--text);
    border-radius: 12px;
    padding: 11px 13px;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .composer textarea::placeholder { color: #5d6b87; }

  .composer textarea:focus {
    border-color: rgba(139, 156, 255, 0.55);
    box-shadow: 0 0 0 3px rgba(139, 156, 255, 0.09);
  }

  .send-btn {
    border: 0;
    border-radius: 12px;
    padding: 0 17px;
    height: 42px;
    color: #0a1020;
    font-size: 13px;
    font-weight: 650;
    background: linear-gradient(135deg, #dfe7ff, #94a7ff 62%, #72e7d4);
    box-shadow: 0 8px 25px rgba(139, 156, 255, 0.18);
    transition: 0.18s ease;
    white-space: nowrap;
  }

  .send-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.04); }

  .hint {
    margin: 0;
    padding: 4px 18px 11px;
    color: #5f6d89;
    font-size: 10.5px;
    letter-spacing: 0.1px;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 13px;
    min-width: 0;
    max-height: calc(100vh - 132px);
    overflow-y: auto;
    padding-right: 2px;
  }

  .card {
    border-radius: var(--radius);
    padding: 15px;
    flex: 0 0 auto;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .card-head h2 {
    margin: 0;
    color: #dce6fb;
    font-size: 12.5px;
    font-weight: 620;
    letter-spacing: 0.4px;
  }

  .card-meta {
    color: var(--soft);
    font-size: 10.5px;
    white-space: nowrap;
  }

  .progress-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .progress-item {
    display: grid;
    grid-template-columns: 23px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    padding: 6px 0;
    position: relative;
    color: var(--soft);
    font-size: 12px;
  }

  .progress-item:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 11px;
    top: 29px;
    bottom: -3px;
    width: 1px;
    background: var(--line);
  }

  .progress-num {
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid var(--line);
    color: #73819c;
    font-size: 10.5px;
    font-weight: 650;
    z-index: 1;
  }

  .progress-item.done { color: #b5c4e2; }
  .progress-item.done .progress-num {
    color: #07251f;
    background: linear-gradient(135deg, #b6f8ea, #5eead4);
    border-color: transparent;
  }

  .progress-item.active { color: #f0f4ff; }
  .progress-item.active .progress-num {
    color: #10162a;
    background: linear-gradient(135deg, #e1e8ff, #8b9cff);
    border-color: transparent;
    box-shadow: 0 0 0 4px rgba(139, 156, 255, 0.10);
  }

  .progress-status {
    font-size: 10px;
    color: #5f6d89;
    white-space: nowrap;
  }

  .progress-item.done .progress-status { color: #6fcfbd; }
  .progress-item.active .progress-status { color: #a9b8ff; }

  .cause-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .cause-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .cause-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-size: 11.5px;
  }

  .cause-name { color: #c0cce5; }
  .cause-score { color: #6e7d99; font-size: 10.5px; font-variant-numeric: tabular-nums; }

  .cause-row.top .cause-name { color: #f2f6ff; }
  .cause-row.top .cause-score { color: var(--amber); }

  .cause-bar {
    width: 100%;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.045);
    overflow: hidden;
  }

  .cause-fill {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #8b9cff, #b49cff);
    transition: width 0.38s cubic-bezier(0.22, 0.8, 0.3, 1);
  }

  .cause-row[data-cause="wearing_issue"] .cause-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .cause-row[data-cause="power_issue"] .cause-fill { background: linear-gradient(90deg, #fb923c, #f97316); }
  .cause-row[data-cause="sync_issue"] .cause-fill { background: linear-gradient(90deg, #60a5fa, #38bdf8); }
  .cause-row[data-cause="app_issue"] .cause-fill { background: linear-gradient(90deg, #c084fc, #a78bfa); }
  .cause-row[data-cause="data_sufficiency"] .cause-fill { background: linear-gradient(90deg, #2dd4bf, #5eead4); }
  .cause-row[data-cause="hardware_fault"] .cause-fill { background: linear-gradient(90deg, #fb7185, #f43f5e); }
  .cause-row[data-cause="needs_human"] .cause-fill { background: linear-gradient(90deg, #94a3b8, #64748b); }

  .cause-hint {
    color: #5f6d89;
    font-size: 10px;
    line-height: 1.35;
  }

  .api-count {
    display: inline-flex;
    min-width: 19px;
    height: 19px;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    border-radius: 999px;
    color: #aebce0;
    background: rgba(139, 156, 255, 0.11);
    border: 1px solid rgba(139, 156, 255, 0.18);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .api-log {
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-height: 260px;
    overflow-y: auto;
  }

  .api-empty {
    color: #5c6a86;
    font-size: 11px;
    line-height: 1.55;
    padding: 2px 0 4px;
  }

  .api-entry {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(7, 12, 23, 0.45);
    overflow: hidden;
  }

  .api-entry summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 9px;
    color: #9cabcb;
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  .api-entry summary::-webkit-details-marker { display: none; }
  .api-entry summary:hover { color: #d4def5; background: rgba(255, 255, 255, 0.025); }

  .api-entry[open] summary { border-bottom: 1px solid var(--line); }

  .api-kind {
    color: #b8c5e4;
    font-weight: 600;
    letter-spacing: 0.25px;
  }

  .api-detail { padding: 8px; }

  .api-subhead {
    color: #6d7c99;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 0 0 4px;
  }

  .api-detail pre {
    margin: 0 0 8px;
    padding: 8px;
    max-height: 190px;
    overflow: auto;
    border-radius: 7px;
    background: rgba(3, 7, 15, 0.65);
    color: #aebbd9;
    font: 9.5px/1.55 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .api-detail pre:last-child { margin-bottom: 0; }

  .final-msg { margin-top: 4px; }

  .final-bubble {
    border-color: rgba(94, 234, 212, 0.22);
    background:
      linear-gradient(150deg, rgba(21, 38, 49, 0.96), rgba(22, 29, 55, 0.96));
    padding: 16px;
    max-width: 100%;
  }

  .final-kicker {
    color: #77e7d2;
    font-size: 10.5px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .final-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .final-title {
    font-size: 18px;
    font-weight: 680;
    letter-spacing: 0.1px;
    line-height: 1.35;
    margin: 0;
  }

  .owner-chip {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 10.5px;
    white-space: nowrap;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: #c7d3ec;
  }

  .owner-chip.owner-user {
    color: #ffe5a3;
    border-color: rgba(251, 191, 36, 0.26);
    background: rgba(251, 191, 36, 0.08);
  }

  .owner-chip.owner-rd {
    color: #ffbdc8;
    border-color: rgba(251, 113, 133, 0.28);
    background: rgba(251, 113, 133, 0.08);
  }

  .owner-chip.owner-human {
    color: #d5ddea;
    border-color: rgba(148, 163, 184, 0.28);
    background: rgba(148, 163, 184, 0.09);
  }

  .owner-chip.owner-support {
    color: #c4d6ff;
    border-color: rgba(96, 165, 250, 0.26);
    background: rgba(96, 165, 250, 0.08);
  }

  .final-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 13px;
    margin-top: 10px;
    color: #8fa0c0;
    font-size: 11px;
    line-height: 1.5;
  }

  .final-meta strong { color: #d8e2f6; font-weight: 600; }

  .confidence-track {
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    margin-top: 12px;
  }

  .confidence-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #5eead4, #8b9cff);
  }

  .final-warning {
    margin-top: 10px;
    padding: 8px 9px;
    border-radius: 9px;
    color: #ffe4a7;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.19);
    font-size: 10.5px;
    line-height: 1.55;
  }

  .final-section { margin-top: 14px; }

  .final-section h3 {
    margin: 0 0 7px;
    color: #9eadc8;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.55px;
    text-transform: uppercase;
  }

  .evidence-list,
  .action-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .evidence-list li {
    color: #b9c6df;
    font-size: 10.8px;
    line-height: 1.55;
    padding-left: 11px;
    position: relative;
  }

  .evidence-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #6e84b3;
  }

  .evidence-list b { color: #e0e8f8; font-weight: 600; }

  .action-list { counter-reset: actions; }

  .action-list li {
    counter-increment: actions;
    position: relative;
    padding-left: 24px;
    color: #cbd7ec;
    font-size: 11.5px;
    line-height: 1.6;
  }

  .action-list li::before {
    content: counter(actions, decimal-leading-zero);
    position: absolute;
    left: 0;
    top: 1px;
    color: #6fe3cf;
    font: 9.5px/1.7 "SFMono-Regular", Consolas, monospace;
  }

  .final-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .summary-pill {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.035);
    border-radius: 999px;
    padding: 4px 8px;
    color: #96a5c1;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .summary-pill b { color: #dbe5f7; font-weight: 600; }

  .final-actions { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; }

  .primary {
    border: 0;
    border-radius: 10px;
    padding: 9px 13px;
    color: #08141b;
    background: linear-gradient(135deg, #9cf3e3, #83a1ff);
    font-size: 11.5px;
    font-weight: 650;
  }

  .primary:hover { filter: brightness(1.06); }

  @media (max-width: 1020px) {
    .layout { grid-template-columns: 1fr; }
    .chat-panel { height: min(74vh, 760px); min-height: 580px; }
    .side { max-height: none; overflow: visible; }
    .card { backdrop-filter: none; }
  }

  @media (max-width: 620px) {
    .shell { width: min(100% - 22px, 1320px); padding-top: 14px; }
    .topbar { align-items: flex-start; }
    .brand h1 { font-size: 15px; }
    .brand p { font-size: 10.5px; }
    .logo { width: 38px; height: 38px; font-size: 21px; }
    .security-note { display: none; }
    .case-bar { padding: 11px 13px; }
    .chat { padding: 15px 13px 6px; }
    .msg-body { max-width: 84%; }
    .bubble { font-size: 13px; padding: 11px 12px; }
    .quick-replies { padding: 3px 13px 8px; }
    .quick-btn { font-size: 11.5px; padding: 7px 10px; }
    .composer { padding: 9px 10px 5px; }
    .hint { padding-left: 13px; }
    .chat-panel { height: min(76vh, 720px); min-height: 540px; }
    .final-title { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">☾</div>
      <div>
        <h1>睡眠手环 · 智能排障台</h1>
        <p>首夜无数据 · Jev System One 实时判断 · 生产环境模拟</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge"><span class="dot"></span> Jev 在线判断</span>
      <button class="ghost" id="resetBtn" type="button">重新开始</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat-panel" aria-label="排障对话">
      <div class="case-bar">
        <div class="case-id">
          <span class="case-chip" id="caseStatus">待定位</span>
          <strong id="caseTitle">案例 #SLP-1101 · 睡眠手环 · 首夜无数据</strong>
        </div>
        <span class="security-note">API Key 仅在后端</span>
      </div>

      <div class="chat" id="chat" aria-live="polite" aria-label="对话记录"></div>

      <div class="quick-replies" id="quickReplies" aria-label="快捷回答"></div>

      <form class="composer" id="composer">
        <textarea id="answerInput" rows="1" placeholder="也可以直接输入你的情况…" aria-label="输入回答"></textarea>
        <button class="send-btn" id="sendBtn" type="submit">发送</button>
      </form>
      <p class="hint">Enter 发送 · Shift + Enter 换行 · 也可以点上方快捷回答</p>
    </section>

    <aside class="side" aria-label="诊断面板">
      <section class="card">
        <div class="card-head">
          <h2>排查进度</h2>
          <span class="card-meta" id="progressMeta">0 / 6</span>
        </div>
        <div class="progress-list" id="progressList"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>可能原因</h2>
          <span class="card-meta">规则累计</span>
        </div>
        <div class="cause-list" id="causeList">
          <div class="api-empty">等待第一条信号…</div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>API 调用</h2>
          <span class="api-count" id="apiCount">0</span>
        </div>
        <div class="api-log" id="apiLog">
          <div class="api-empty">每轮回答会调用一次 Jev；最终再做一次综合判断。展开可看完整请求与响应。</div>
        </div>
      </section>
    </aside>
  </main>
</div>

<script>
(() => {
  "use strict";

  const chatEl = document.getElementById("chat");
  const quickEl = document.getElementById("quickReplies");
  const composer = document.getElementById("composer");
  const inputEl = document.getElementById("answerInput");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const progressList = document.getElementById("progressList");
  const progressMeta = document.getElementById("progressMeta");
  const causeList = document.getElementById("causeList");
  const apiLog = document.getElementById("apiLog");
  const apiCount = document.getElementById("apiCount");
  const caseTitle = document.getElementById("caseTitle");
  const caseStatus = document.getElementById("caseStatus");

  const TOTAL_STAGES = 6;
  const state = {
    stages: [],
    causes: [],
    model: "jev-latest",
    current: 0,
    history: [],
    scores: {},
    busy: false,
    done: false,
    awaitingFinal: false,
    apiCalls: 0,
    started: false,
  };

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function pct(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return "—";
    return `${Math.round(Math.max(0, Math.min(1, n)) * 100)}%`;
  }

  function scrollChat() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function scrollApi() {
    apiLog.scrollTop = 0;
  }

  function addMessage(role, text, options = {}) {
    const msg = el("div", `msg ${role}`);
    const avatar = el(
      "div",
      `avatar ${role}`,
      role === "assistant" ? "☾" : "我"
    );
    avatar.setAttribute("aria-hidden", "true");

    const body = el("div", "msg-body");
    if (options.stage) {
      body.appendChild(el("div", "stage-tag", options.stage));
    }
    const bubble = el("div", "bubble");
    bubble.appendChild(el("div", "bubble-text", text));
    body.appendChild(bubble);

    if (options.note) {
      const note = el("div", "signal-line");
      note.appendChild(el("strong", "", "信号 · "));
      note.appendChild(document.createTextNode(options.note));
      body.appendChild(note);
    }

    msg.append(avatar, body);
    chatEl.appendChild(msg);
    scrollChat();
    return msg;
  }

  function addTyping() {
    const msg = el("div", "msg assistant");
    const avatar = el("div", "avatar assistant", "☾");
    avatar.setAttribute("aria-hidden", "true");
    const body = el("div", "msg-body");
    const bubble = el("div", "bubble");
    const dots = el("div", "typing");
    dots.setAttribute("aria-label", "Jev 正在判断");
    dots.append(el("span"), el("span"), el("span"));
    bubble.appendChild(dots);
    body.appendChild(bubble);
    msg.append(avatar, body);
    chatEl.appendChild(msg);
    scrollChat();
    return msg;
  }

  function updateComposerState() {
    const disabled =
      state.busy ||
      state.done ||
      state.awaitingFinal ||
      !state.started ||
      state.stages.length === 0;
    inputEl.disabled = disabled;
    sendBtn.disabled = disabled;
    resetBtn.disabled = state.busy;
    if (!disabled) inputEl.focus();
  }

  function setQuickReplies(replies) {
    quickEl.replaceChildren();
    if (!replies || !replies.length || state.done) return;
    replies.forEach((reply) => {
      const button = el("button", "quick-btn", reply.label);
      button.type = "button";
      button.disabled = state.busy;
      button.addEventListener("click", () => {
        sendAnswer(reply.value, reply.label);
      });
      quickEl.appendChild(button);
    });
  }

  function setBusy(busy) {
    state.busy = busy;
    sendBtn.textContent = busy ? "判断中…" : "发送";
    updateComposerState();
    quickEl.querySelectorAll("button").forEach((button) => {
      button.disabled = busy;
    });
  }

  function renderProgress() {
    progressList.replaceChildren();
    const completed = state.history.length;
    const total = state.stages.length || TOTAL_STAGES;
    progressMeta.textContent = `${completed} / ${total}`;

    state.stages.forEach((stage, index) => {
      const isDone =
        state.done ||
        state.history.some((item) => item.stage_id === stage.id);
      const isActive = !state.done && index === state.current;
      const row = el(
        "div",
        `progress-item${isDone ? " done" : ""}${isActive ? " active" : ""}`
      );
      row.appendChild(el("span", "progress-num", isDone ? "✓" : String(index + 1)));
      row.appendChild(el("span", "progress-title", stage.title));
      row.appendChild(
        el(
          "span",
          "progress-status",
          isDone ? "已完成" : isActive ? "进行中" : "待排查"
        )
      );
      progressList.appendChild(row);
    });
  }

  function renderCauses(scores) {
    const activeScores = scores || state.scores;
    causeList.replaceChildren();
    if (!state.causes.length) {
      causeList.appendChild(el("div", "api-empty", "等待第一条信号…"));
      return;
    }

    const values = state.causes.map((cause) =>
      Math.max(0, Number(activeScores[cause.id]) || 0)
    );
    const max = Math.max(1, ...values);

    state.causes.forEach((cause, index) => {
      const score = values[index];
      const isTop = score > 0 && score === Math.max(...values);
      const row = el("div", `cause-row${isTop ? " top" : ""}`);
      row.dataset.cause = cause.id;

      const top = el("div", "cause-top");
      top.appendChild(el("span", "cause-name", cause.label));
      top.appendChild(el("span", "cause-score", score ? `+${score}` : "—"));
      row.appendChild(top);

      const bar = el("div", "cause-bar");
      const fill = el("span", "cause-fill");
      fill.style.width = score ? `${Math.max(7, (score / max) * 100)}%` : "0%";
      bar.appendChild(fill);
      row.appendChild(bar);

      row.appendChild(
        el("div", "cause-hint", `${cause.owner} · ${cause.hint}`)
      );
      causeList.appendChild(row);
    });
  }

  function addApiLog(kind, data) {
    state.apiCalls += 1;
    apiCount.textContent = String(state.apiCalls);

    const entry = document.createElement("details");
    entry.className = "api-entry";
    const summary = document.createElement("summary");

    const kindEl = el("span", "api-kind", kind);
    const usage = data.usage || {};
    const inTok = Number.isFinite(Number(usage.input_tokens))
      ? usage.input_tokens
      : "—";
    const outTok = Number.isFinite(Number(usage.output_tokens))
      ? usage.output_tokens
      : "—";
    const meta = el(
      "span",
      "",
      `#${state.apiCalls} · ${data.latency_ms ?? "—"}ms · ${inTok}/${outTok} tok`
    );
    summary.append(kindEl, meta);

    const detail = el("div", "api-detail");
    const reqHead = el("p", "api-subhead", "请求 · model / state / questions");
    const reqPre = document.createElement("pre");
    reqPre.textContent = JSON.stringify(data.request, null, 2);
    const resHead = el("p", "api-subhead", "响应 · answers / usage");
    const resPre = document.createElement("pre");
    resPre.textContent = JSON.stringify(data.response, null, 2);
    detail.append(reqHead, reqPre, resHead, resPre);

    entry.append(summary, detail);
    apiLog.prepend(entry);
    while (apiLog.children.length > 8) {
      apiLog.removeChild(apiLog.lastElementChild);
    }
    scrollApi();
  }

  function askStage(index) {
    const stage = state.stages[index];
    if (!stage) {
      finish();
      return;
    }
    state.current = index;
    renderProgress();
    addMessage("assistant", stage.assistant, {
      stage: `${index + 1} / ${state.stages.length} · ${stage.title}`,
    });
    setQuickReplies(stage.quick_replies);
    updateComposerState();
  }

  async function sendAnswer(value, displayValue) {
    if (state.busy || state.done || !state.started) return;
    const stage = state.stages[state.current];
    const answer = String(value || "").trim();
    if (!stage || !answer) return;

    addMessage("user", (displayValue || answer).trim());
    setQuickReplies([]);
    setBusy(true);
    const typing = addTyping();

    try {
      const response = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          stage_id: stage.id,
          answer,
          history: state.history,
        }),
      });
      const data = await response.json();
      typing.remove();
      if (!response.ok) {
        throw new Error(data.detail || data.error || `HTTP ${response.status}`);
      }

      state.history.push({
        stage_id: stage.id,
        stage_title: stage.title,
        question: stage.assistant,
        answer,
        signal: data.signal,
      });

      Object.entries(data.effects || {}).forEach(([cause, delta]) => {
        state.scores[cause] = (state.scores[cause] || 0) + Number(delta || 0);
      });
      renderCauses();

      const clearNote =
        Number(data.signal.clear) < 0.55
          ? "回答较模糊，最终结论会降低确定性"
          : `已记录第 ${state.history.length} / ${state.stages.length} 项信号`;
      addMessage(
        "assistant",
        `我判断：${data.signal.label}。`,
        {
          note: `${clearNote} · 置信度 ${pct(data.signal.confidence)} · 回答清晰度 ${pct(data.signal.clear)}`,
        }
      );
      addApiLog("turn", data);

      if (data.next_stage_id) {
        const nextIndex = state.stages.findIndex(
          (item) => item.id === data.next_stage_id
        );
        setBusy(false);
        askStage(nextIndex);
      } else {
        await finish();
      }
    } catch (error) {
      typing.remove();
      addMessage(
        "assistant",
        `这次判断没有成功：${error.message || "未知错误"}。你可以再试一次。`
      );
      setBusy(false);
      setQuickReplies(stage.quick_replies);
      updateComposerState();
    }
  }

  function causeById(id) {
    return state.causes.find((cause) => cause.id === id);
  }

  function makeFinalCard(data) {
    const msg = el("div", "msg assistant final-msg");
    const avatar = el("div", "avatar assistant", "☾");
    avatar.setAttribute("aria-hidden", "true");
    const body = el("div", "msg-body");
    const bubble = el("div", "bubble final-bubble");

    bubble.appendChild(el("div", "final-kicker", "诊断结论 · Jev + 规则守卫"));

    const titleRow = el("div", "final-title-row");
    titleRow.appendChild(el("h2", "final-title", data.final_cause.label));
    const ownerChip = el(
      "span",
      `owner-chip owner-${data.owner_type || "support"}`,
      data.recommendation.owner
    );
    titleRow.appendChild(ownerChip);
    bubble.appendChild(titleRow);

    const meta = el("div", "final-meta");
    if (data.override_reason) {
      const original = causeById(data.final_cause.original_choice);
      meta.appendChild(
        el(
          "span",
          "",
          `原判断：${original ? original.label : data.final_cause.original_choice} · 置信度 ${pct(data.final_cause.confidence)}`
        )
      );
    } else {
      meta.appendChild(
        el("span", "", `置信度 ${pct(data.final_cause.confidence)}`)
      );
    }
    meta.appendChild(
      el("span", "", `人工介入概率 ${pct(data.needs_human)}`)
    );
    meta.appendChild(
      el("span", "", `优先级 ${Number(data.severity.score).toFixed(1)} / 2 · ${data.severity.label}`)
    );
    bubble.appendChild(meta);

    if (!data.override_reason) {
      const track = el("div", "confidence-track");
      const fill = el("span", "confidence-fill");
      fill.style.width = `${Math.max(2, Math.round(Number(data.final_cause.confidence || 0) * 100))}%`;
      track.appendChild(fill);
      bubble.appendChild(track);
    }

    if (data.override_reason) {
      bubble.appendChild(el("div", "final-warning", data.override_reason));
    } else if (data.review_note) {
      bubble.appendChild(el("div", "final-warning", data.review_note));
    }

    const evidenceSection = el("div", "final-section");
    evidenceSection.appendChild(el("h3", "", "判断依据"));
    const evidenceList = el("ul", "evidence-list");
    (data.evidence || []).forEach((item) => {
      const li = document.createElement("li");
      li.appendChild(el("b", "", `${item.stage}：`));
      li.appendChild(
        document.createTextNode(`${item.label}（置信度 ${pct(item.confidence)}）`)
      );
      evidenceList.appendChild(li);
    });
    evidenceSection.appendChild(evidenceList);
    bubble.appendChild(evidenceSection);

    const actionSection = el("div", "final-section");
    actionSection.appendChild(el("h3", "", "建议动作"));
    const actions = el("ul", "action-list");
    (data.recommendation.actions || []).forEach((action) => {
      actions.appendChild(el("li", "", action));
    });
    actionSection.appendChild(actions);
    bubble.appendChild(actionSection);

    const sorted = Object.entries(data.rule_scores || {})
      .filter(([, score]) => Number(score) > 0)
      .sort((a, b) => Number(b[1]) - Number(a[1]))
      .slice(0, 3);
    if (sorted.length) {
      const summary = el("div", "final-summary");
      sorted.forEach(([id, score]) => {
        const cause = causeById(id);
        const pill = el("span", "summary-pill");
        pill.appendChild(document.createTextNode(`${cause ? cause.label : id} `));
        pill.appendChild(el("b", "", `+${score}`));
        summary.appendChild(pill);
      });
      bubble.appendChild(summary);
    }

    const finalActions = el("div", "final-actions");
    const again = el("button", "primary", "再跑一遍");
    again.type = "button";
    again.addEventListener("click", resetDemo);
    finalActions.appendChild(again);
    bubble.appendChild(finalActions);

    body.appendChild(bubble);
    msg.append(avatar, body);
    chatEl.appendChild(msg);
    scrollChat();
  }

  async function finish() {
    if (state.done) return;
    state.awaitingFinal = true;
    addMessage(
      "assistant",
      "六项信息都收到了。现在我会把全部证据交给 Jev 做一次综合判断，并过一遍规则守卫。"
    );
    const typing = addTyping();
    setBusy(true);

    try {
      const response = await fetch("/api/final", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history: state.history }),
      });
      const data = await response.json();
      typing.remove();
      if (!response.ok) {
        throw new Error(data.detail || data.error || `HTTP ${response.status}`);
      }

      state.done = true;
      state.awaitingFinal = false;
      state.current = state.stages.length;
      caseStatus.textContent = "已定位";
      caseStatus.classList.add("resolved");
      renderProgress();
      renderCauses(data.rule_scores || state.scores);
      addApiLog("final", data);
      makeFinalCard(data);
      setQuickReplies([]);
      setBusy(false);
      updateComposerState();
    } catch (error) {
      typing.remove();
      addMessage(
        "assistant",
        `综合判断没有成功：${error.message || "未知错误"}。`
      );
      setBusy(false);
      const retry = el("button", "quick-btn", "重试综合判断");
      retry.type = "button";
      retry.addEventListener("click", () => {
        quickEl.replaceChildren();
        finish();
      });
      quickEl.replaceChildren(retry);
      updateComposerState();
    }
  }

  function resetDemo() {
    if (state.busy) return;
    state.current = 0;
    state.history = [];
    state.scores = {};
    state.busy = false;
    state.done = false;
    state.awaitingFinal = false;
    state.apiCalls = 0;
    caseStatus.textContent = "待定位";
    caseStatus.classList.remove("resolved");
    chatEl.replaceChildren();
    quickEl.replaceChildren();
    apiLog.replaceChildren();
    apiLog.appendChild(
      el(
        "div",
        "api-empty",
        "每轮回答会调用一次 Jev；最终再做一次综合判断。展开可看完整请求与响应。"
      )
    );
    apiCount.textContent = "0";
    renderProgress();
    renderCauses();
    addMessage(
      "assistant",
      `收到。你昨晚佩戴了一整晚，但今早 App 里没有睡眠数据。我会按 ${state.stages.length} 个方向逐项排查：佩戴、电量、同步、App、时长、硬件。每一项都会让 Jev 给出结构化判断。我们先从佩戴开始。`
    );
    askStage(0);
    setBusy(false);
    updateComposerState();
  }

  async function init() {
    updateComposerState();
    try {
      const response = await fetch("/api/stages");
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      state.stages = data.stages || [];
      state.causes = data.causes || [];
      state.model = data.model || "jev-latest";
      state.started = true;
      caseTitle.textContent = `案例 #SLP-1101 · ${data.product || "睡眠手环"} · 首夜无数据`;

      renderProgress();
      renderCauses();
      addMessage(
        "assistant",
        `收到。你昨晚佩戴了一整晚，但今早 App 里没有睡眠数据。我会按 ${state.stages.length} 个方向逐项排查：佩戴、电量、同步、App、时长、硬件。每一项都会让 Jev 给出结构化判断。我们先从佩戴开始。`
      );
      askStage(0);
      updateComposerState();
    } catch (error) {
      addMessage(
        "assistant",
        `无法加载排障流程：${error.message || "本地服务未启动"}。请先运行 python3 support-demo/server.py。`
      );
      updateComposerState();
    }
  }

  composer.addEventListener("submit", (event) => {
    event.preventDefault();
    const value = inputEl.value.trim();
    if (!value || state.busy || state.done) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendAnswer(value);
  });

  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      composer.requestSubmit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 112)}px`;
  });

  resetBtn.addEventListener("click", resetDemo);

  init();
})();
</script>
</body>
</html>
